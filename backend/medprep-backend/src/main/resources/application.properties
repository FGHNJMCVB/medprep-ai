spring.application.name=medprep-backend

server.port=${PORT:8080}

# ==========================================================
# PostgreSQL
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medprep}
spring.datasource.username=${DB_USERNAME:mary}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================================
# JPA / Hibernate
# ==========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# JWT
# ==========================================================

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Explicit browser origins, separated by commas. Production overrides this.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ==========================================================
# Gemini
# ==========================================================

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash

# The application uses the reviewed database question bank for
# topic practice, subject mocks, and full FMGE mock tests.
# Keep the optional Gemini Batch admin endpoints disabled unless
# batch generation is intentionally enabled with an API key.
gemini.batch.enabled=${GEMINI_BATCH_ENABLED:false}
